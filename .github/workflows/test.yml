on:
  workflow_call:
    inputs:
      dir:
        required: true
        type: string
      docker-push:
        required: true
        type: boolean
      docker-image:
        required: true
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: '${{ inputs.dir }}/go.mod'
      - run: cd ${{ inputs.dir }} && go test ./...
  build_push_docker:
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v7.0.1

      # commenting out because we are not pushing anywhere
      #- name: Login to Docker Hub
      #  uses: docker/login-action@v4
      #  with:
      #    username: ${{ vars.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: ${{ inputs.docker-image }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.docker-push }}
          context: ${{ inputs.dir }}
        #  cache-from: type=registry,ref=${{ inputs.docker-image }}:buildcache
        #  cache-to: type=registry,ref=${{ inputs.docker-image }}:buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
